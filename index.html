<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Altman-conquer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 520px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
    a.btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600;
      padding: 12px 20px; border-radius: 10px; }
    a.btn:hover { background: #1d4ed8; }
    .links { margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155; font-size: 0.85rem; }
    .links a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Altman-conquer</h1>
    <p>GitHub Pages user site root. Hosts <code>ads.txt</code> for Google AdSense.</p>
    <a class="btn" href="https://altman-conquer.github.io/bibtex-verifier/">Open BibTeX Verifier</a>
    <div class="links">
      <a href="https://github.com/Altman-conquer/bibtex-verifier">GitHub repo</a>
      &nbsp;|&nbsp;
      <a href="https://pypi.org/project/bibtex-verifier/">PyPI</a>
